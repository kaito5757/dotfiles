
"$schema" = "https://starship.rs/config-schema.json"

# ==========================================
# Catppuccin Mocha - Sharp Powerline
# ==========================================

add_newline = true
palette = "catppuccin_mocha"

scan_timeout = 30
command_timeout = 500

# 1行目: Path / Git / Runtimes / Duration / Time
# 2行目: Command prompt
format = """
$directory\
$git_branch\
$git_status\
$time\
$nodejs\
$bun\
$python\
$cmd_duration\
$line_break\
$character"""

# ------------------------------------------
# Directory
# ------------------------------------------

[directory]
style = "bg:blue fg:crust"
format = "[ 󰉋 $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"

# ------------------------------------------
# Git Branch - Sharp Powerline
# ------------------------------------------

[git_branch]
symbol = ""
style = "bg:mauve fg:crust"
format = "[](fg:blue bg:mauve)[ $symbol $branch ]($style)[](fg:mauve)"
truncation_length = 28
truncation_symbol = "…"

# ------------------------------------------
# Git Status
# ------------------------------------------

[git_status]
style = "bold yellow"
format = " [$all_status$ahead_behind]($style) "

conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "≡${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# ------------------------------------------
# Runtimes
# ------------------------------------------

[nodejs]
symbol = ""
style = "green"
format = " [$symbol $version]($style)"
version_format = "v${major}.${minor}"

[bun]
symbol = ""
style = "peach"
format = " [$symbol $version]($style)"
version_format = "v${major}.${minor}"

[python]
symbol = ""
style = "yellow"
format = " [$symbol $version]($style)"
version_format = "v${major}.${minor}"

# ------------------------------------------
# Command Duration
# ------------------------------------------

[cmd_duration]
min_time = 2000
show_milliseconds = false
show_notifications = false
format = "  [󱦟 $duration](peach)"

# ------------------------------------------
# Time
# ------------------------------------------

[time]
disabled = false
time_format = "%H:%M"
format = "[ $time](lavender)"

# ------------------------------------------
# Prompt Character
# ------------------------------------------

[line_break]
disabled = false

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold mauve)"
vimcmd_replace_symbol = "[❮](bold mauve)"
vimcmd_visual_symbol = "[❮](bold yellow)"

# ------------------------------------------
# Catppuccin Mocha Palette
# ------------------------------------------

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
